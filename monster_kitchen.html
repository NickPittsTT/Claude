        // ---------- MONEY (exam Q8: she circled far more than the target;
        // teach counting notes, then stopping EXACTLY at the target) ----------
        function noteHTML(value) {
            return `<div class="note ${value === 5 ? 'five' : 'one'}">$${value}</div>`;
        }

        function genMoneyQ(band) {
            if (band === 1 || (band === 4 && Math.random() < 0.5)) {
                // Count the money: TT notes are $5 (green) and $1 (red)
                const fives = Math.random() < 0.5 ? 1 : 0;
                const ones = 1 + Math.floor(Math.random() * 4);
                const total = fives * 5 + ones;
                const notes = [...Array(fives).fill(5), ...Array(ones).fill(1)];
                return {
                    prompt: `How much <b class="kw">MONEY</b>?`,
                    say: `How much money is this? Count it!`,
                    visual: `<div class="note-row">${notes.map(noteHTML).join('')}</div>`,
                    answers: numberButtons(Math.max(1, total - 3), Math.min(10, total + 3))
                        .map(b => ({ html: '$' + b.html, value: b.value })),
                    correct: total,
                    explain: `Yes! That makes <b class="kw">$${total}</b>!`,
                    explainSay: `Yes! That makes ${total} dollars!`,
                    hint: () => ({
                        text: fives
                            ? `The green note is <b class="kw">5</b>. Start at 5, count ON!`
                            : `Count the notes one by one!`,
                        say: fives
                            ? `The green note is 5 dollars. Start at 5 and count on the red ones!`
                            : `Count the red notes one by one!`
                    })
                };
            }
            // Make the target amount — running total shown early, hidden later
            const target = 6 + Math.floor(Math.random() * 5);   // $6..$10
            const showTotal = band <= 2;
            const q = {
                prompt: `Make <b class="kw">$${target}</b>!`,
                say: `Make ${target} dollars! Tap the notes. Stop at exactly ${target}!`,
                visual: `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
                            <div class="big-object" style="animation:none;">👛</div>
                            <div class="money-total" id="moneyTotal">${showTotal ? '$0' : ''}</div>
                         </div>`,
                correct: target,
                explain: `Yes! Exactly <b class="kw">$${target}</b>!`,
                explainSay: `Yes! Exactly ${target} dollars! Great counting!`,
                customAnswers(container) {
                    const tray = [5, 5, 1, 1, 1, 1, 1, 1];
                    const sum = () => Array.from(container.querySelectorAll('.note.selected'))
                        .reduce((s, n) => s + parseInt(n.dataset.value), 0);
                    const refresh = () => {
                        const t = document.getElementById('moneyTotal');
                        if (t && showTotal) t.textContent = '$' + sum();
                    };
                    tray.forEach(v => {
                        const n = document.createElement('button');
                        n.className = 'note ' + (v === 5 ? 'five' : 'one');
                        n.dataset.value = v;
                        n.textContent = '$' + v;
                        n.onclick = () => {
                            n.classList.toggle('selected');
                            playSound('pop');
                            refresh();
                        };
                        container.appendChild(n);
                    });
                    const done = document.createElement('button');
                    done.className = 'answer-btn';
                    done.id = 'moneyDone';
                    done.textContent = '✔';
                    done.onclick = () => {
                        if (!currentQ) return;
                        const s = sum();
                        if (s === target) {
                            mathSuccess(q, done);
                        } else {
                            // Re-scaffold: reveal the running total after a miss
                            const t = document.getElementById('moneyTotal');
                            if (t) t.textContent = '$' + s;
                            mathWrong(q, s > target ? {
                                text: `$${s} is <b class="kw">MORE</b> than $${target}. Take some away!`,
                                say: `${s} dollars is too much! Stop at ${target}. Take some away!`
                            } : {
                                text: `$${s} is not enough. Count ON to $${target}!`,
                                say: `${s} dollars is not enough yet. Count on to ${target}!`
                            }, done);
                        }
                    };
                    container.appendChild(done);
                }
            };
            return q;
        }

        // ---------- WORDS (exam Q9: circled the elephant for "lighter";
        // the asked word flips between rounds so she can't pattern-match) ----------
        const WEIGHT_PAIRS = [
            { big: '🐘', small: '🐭', bigName: 'elephant', smallName: 'mouse' },
            { big: '🐋', small: '🐠', bigName: 'whale', smallName: 'little fish' },
            { big: '🚚', small: '🎈', bigName: 'truck', smallName: 'balloon' },
            { big: '🐄', small: '🐥', bigName: 'cow', smallName: 'chick' }
        ];
        const WORD_MEANINGS = {
            BIGGER: 'BIGGER means large', SMALLER: 'SMALLER means little',
            HEAVIER: 'HEAVIER means hard to lift', LIGHTER: 'LIGHTER means easy to lift, NOT heavy',
            LONGER: 'LONGER means it stretches far', SHORTER: 'SHORTER means little',
            MORE: 'MORE means a lot', LESS: 'LESS means not many'
        };

        function genWordsQ(band) {
            const dims = band === 1 ? ['size', 'length'] : ['size', 'length', 'weight', 'count'];
            const dim = dims[Math.floor(Math.random() * dims.length)];
            const wantBig = Math.random() < 0.5;
            let word, optionBig, optionSmall, explainThing;

            if (dim === 'size') {
                word = wantBig ? 'BIGGER' : 'SMALLER';
                const e = ['🍎', '⭐', '🎁', '🐢', '🌻', '🧸'][Math.floor(Math.random() * 6)];
                optionBig = `<span style="font-size:clamp(64px,13vw,110px)">${e}</span>`;
                optionSmall = `<span style="font-size:clamp(28px,5.5vw,44px)">${e}</span>`;
                explainThing = wantBig ? 'the big one' : 'the little one';
            } else if (dim === 'length') {
                word = wantBig ? 'LONGER' : 'SHORTER';
                optionBig = `<div class="len-bar" style="width:clamp(110px,20vw,170px)"></div>`;
                optionSmall = `<div class="len-bar" style="width:clamp(45px,8vw,70px)"></div>`;
                explainThing = wantBig ? 'the long one' : 'the short one';
            } else if (dim === 'weight') {
                word = wantBig ? 'HEAVIER' : 'LIGHTER';
                const p = WEIGHT_PAIRS[Math.floor(Math.random() * WEIGHT_PAIRS.length)];
                optionBig = `<span style="font-size:clamp(54px,11vw,90px)">${p.big}</span>`;
                optionSmall = `<span style="font-size:clamp(54px,11vw,90px)">${p.small}</span>`;
                explainThing = wantBig ? `the ${p.bigName}` : `the ${p.smallName}`;
            } else {
                word = wantBig ? 'MORE' : 'LESS';
                const e = ['🍓', '🍪', '⚽', '🎈'][Math.floor(Math.random() * 4)];
                const few = 2 + Math.floor(Math.random() * 2);
                const many = few + 2 + Math.floor(Math.random() * 3);
                optionBig = `<div class="pick-group">${(`<span>${e}</span>`).repeat(many)}</div>`;
                optionSmall = `<div class="pick-group">${(`<span>${e}</span>`).repeat(few)}</div>`;
                explainThing = wantBig ? 'the group with a lot' : 'the small group';
            }

            const correctVal = wantBig ? 'big' : 'small';
            const options = shuffled([
                { html: optionBig, value: 'big', pick: true },
                { html: optionSmall, value: 'small', pick: true }
            ]);

            return {
                prompt: `Tap the <b class="kw">${word}</b> one!`,
                say: `Listen for the word! Tap the ${word} one!`,
                visual: `<div style="font-size:clamp(36px,7vw,60px)">👂</div>`,
                answers: options,
                correct: correctVal,
                explain: `Yes! That is ${explainThing} — <b class="kw">${word}</b>!`,
                explainSay: `Yes! That is ${explainThing}. It is ${word}!`,
                hint: () => ({
                    text: `${WORD_MEANINGS[word]}. Tap the <b class="kw">${word}</b> one!`,
                    say: `${WORD_MEANINGS[word]}. Listen again: tap the ${word} one!`
                })
            };
        }

        // ---------- MONTHS (exam Q11b: wrote "5th" when the blank wanted "May";
        // train ordinal -> month NAME mapping) ----------
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];
        const ORDINALS = ['1st', '2nd', '3rd', '4th', '5th', '6th',
                          '7th', '8th', '9th', '10th', '11th', '12th'];

        function monthPath(idx) {
            return `<div class="month-path">${MONTHS.slice(0, idx + 1)
                .map((m, i) => i === idx ? `<b class="kw">${m}</b>` : m).join(' → ')}</div>`;
        }

        function monthRecital(idx) {
            return MONTHS.slice(0, idx + 1).join(', ') + `. ${MONTHS[idx]} is the ${ORDINALS[idx]} month!`;
        }

        function genMonthsQ(band) {
            const maxIdx = band === 1 ? 6 : 12;
            const idx = Math.floor(Math.random() * maxIdx);
            const askName = band < 3 || Math.random() < 0.5;

            if (askName) {
                // "The 5th month is ___" -> wants a month NAME, her exact miss
                const distractors = shuffled(MONTHS.slice(0, maxIdx).filter(m => m !== MONTHS[idx])).slice(0, 2);
                return {
                    prompt: `The <b class="kw">${ORDINALS[idx]}</b> month is…?`,
                    say: `The ${ORDINALS[idx]} month of the year is which month? Say the months in your head!`,
                    visual: `<div class="big-object" style="animation:none;">📅</div>`,
                    answers: shuffled([MONTHS[idx], ...distractors]).map(m => ({ html: m, value: m })),
                    correct: MONTHS[idx],
                    explain: `Yes! <b class="kw">${MONTHS[idx]}</b> is the ${ORDINALS[idx]} month!`,
                    explainSay: monthRecital(idx),
                    hint: () => ({
                        text: `Count the months from January!`,
                        say: monthRecital(idx),
                        reScaffold: monthPath(idx)
                    })
                };
            }
            // "May is the ___ month" -> wants the ordinal
            const distractors = shuffled(ORDINALS.slice(0, maxIdx).filter(o => o !== ORDINALS[idx])).slice(0, 2);
            return {
                prompt: `${MONTHS[idx]} is the <b class="kw">?</b> month`,
                say: `${MONTHS[idx]} is which number month? Count from January!`,
                visual: `<div class="big-object" style="animation:none;">📅</div>`,
                answers: shuffled([ORDINALS[idx], ...distractors]).map(o => ({ html: o, value: o })),
                correct: ORDINALS[idx],
                explain: `Yes! ${MONTHS[idx]} is the <b class="kw">${ORDINALS[idx]}</b> month!`,
                explainSay: monthRecital(idx),
                hint: () => ({
                    text: `Count the months from January!`,
                    say: monthRecital(idx),
                    reScaffold: monthPath(idx)
                })
            };
        }

        // ============================================================
        // COLORING MODULE
        // ============================================================
        const PALETTE = ['#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa',
                         '#ec407a', '#6d4c41', '#26c6da', '#ffd700', '#9ccc65', '#212121'];
        let selectedColor = PALETTE[0];
        let currentPicture = 'monster';

        let coloringSave = {};
        try { coloringSave = JSON.parse(localStorage.getItem('monsterKitchenColoring')) || {}; } catch(e) {}

        // Each picture: white paintable regions with data-r ids; faces/outlines fixed
        const PICTURES = {

                <circle cx="233" cy="172" r="6" fill="#333"/>
                <path class="paintable" data-r="mouth" d="M170 210 Q200 240 230 210 Q215 225 200 224 Q185 225 170 210 Z" fill="#fff" stroke="#333" stroke-width="4"/>

                <ellipse class="paintable" data-r="armR" cx="288" cy="290" rx="22" ry="38" fill="#fff" stroke="#333" stroke-width="4" transform="rotate(-20 288 290)"/>
                <rect class="paintable" data-r="spoon" x="316" y="230" width="14" height="70" rx="7" fill="#fff" stroke="#333" stroke-width="4" transform="rotate(-15 323 265)"/>
                <ellipse class="paintable" data-r="spoonTop" cx="335" cy="222" rx="18" ry="24" fill="#fff" stroke="#333" stroke-width="4" transform="rotate(-15 335 222)"/>

                <path d="M90 341 Q95 330 104 332" fill="none" stroke="#333" stroke-width="4"/>
              </svg>`,
            shapes: `
              <svg viewBox="0 0 400 400">

                <circle cx="88" cy="92" r="6" fill="#333"/><circle cx="122" cy="92" r="6" fill="#333"/>
                <path d="M90 115 Q105 128 120 115" stroke="#333" stroke-width="4" fill="none"/>
                <text x="105" y="192" text-anchor="middle" font-size="24" fill="#333" font-family="inherit">sphere</text>
                <polygon class="paintable" data-r="cubeFront" points="240,70 330,70 330,160 240,160" fill="#fff" stroke="#333" stroke-width="4"/>
                <polygon class="paintable" data-r="cubeTop" points="240,70 268,42 358,42 330,70" fill="#fff" stroke="#333" stroke-width="4"/>

                <circle cx="268" cy="105" r="6" fill="#333"/><circle cx="302" cy="105" r="6" fill="#333"/>
                <path d="M272 130 Q285 140 298 130" stroke="#333" stroke-width="4" fill="none"/>
                <text x="295" y="192" text-anchor="middle" font-size="24" fill="#333" font-family="inherit">cube</text>
                <polygon class="paintable" data-r="cone" points="105,215 55,340 155,340" fill="#fff" stroke="#333" stroke-width="4"/>
                <ellipse class="paintable" data-r="coneBase" cx="105" cy="341" rx="50" ry="15" fill="#fff" stroke="#333" stroke-width="4"/>

              </svg>`,
            icecream: `
              <svg viewBox="0 0 400 400">
                <rect x="0" y="0" width="400" height="400" fill="#fff"/>
                <circle class="paintable" data-r="sun" cx="330" cy="70" r="40" fill="#fff" stroke="#333" stroke-width="4"/>
                <polygon class="paintable" data-r="cone" points="200,385 140,230 260,230" fill="#fff" stroke="#333" stroke-width="4"/>
                <path d="M155 268 L245 268 M168 305 L232 305 M182 342 L218 342" stroke="#333" stroke-width="3"/>
                <ellipse class="paintable" data-r="scoopBottom" cx="200" cy="200" rx="72" ry="48" fill="#fff" stroke="#333" stroke-width="4"/>
                <ellipse class="paintable" data-r="scoopTop" cx="200" cy="130" rx="58" ry="42" fill="#fff" stroke="#333" stroke-width="4"/>
                <circle class="paintable" data-r="cherry" cx="200" cy="78" r="18" fill="#fff" stroke="#333" stroke-width="4"/>
                <path d="M200 60 Q206 44 218 40" fill="none" stroke="#333" stroke-width="4"/>
              </svg>`
        };

        function openColoring() {
            initAudio();
            buildPaletteUI();
            renderPicture();
            showScreen('color');
        }

        function closeColoring() {
            showScreen('title');
        }

        function buildPaletteUI() {
            const pal = document.getElementById('palette');
            if (pal.children.length) return;
            PALETTE.forEach((c, i) => {
                const sw = document.createElement('div');
                sw.className = 'swatch' + (i === 0 ? ' selected' : '');
                sw.style.background = c;
                sw.dataset.color = c;
                sw.onclick = () => {
                    selectedColor = c;
                    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
                    sw.classList.add('selected');
                    playSound('pop');
                };
                pal.appendChild(sw);
            });
        }

        function renderPicture() {
            const canvas = document.getElementById('colorCanvas');
            canvas.innerHTML = PICTURES[currentPicture];
            const saved = coloringSave[currentPicture] || {};
            canvas.querySelectorAll('.paintable').forEach(el => {
                if (saved[el.dataset.r]) el.setAttribute('fill', saved[el.dataset.r]);
                el.addEventListener('click', () => {
                    el.setAttribute('fill', selectedColor);
                    if (!coloringSave[currentPicture]) coloringSave[currentPicture] = {};
                    coloringSave[currentPicture][el.dataset.r] = selectedColor;
                    localStorage.setItem('monsterKitchenColoring', JSON.stringify(coloringSave));
                    playSound('snap');
                    vibrate(10);
                });
            });
        }

        function switchPicture(pic) {
            currentPicture = pic;
            document.querySelectorAll('.pic-tab').forEach(t => t.classList.toggle('active', t.dataset.pic === pic));
            renderPicture();
            playSound('pop');
        }

        function resetPicture() {
            delete coloringSave[currentPicture];
            localStorage.setItem('monsterKitchenColoring', JSON.stringify(coloringSave));
            renderPicture();
            playSound('pop');
        }

        // ============================================================
        // SAVE SYSTEM
        // ============================================================
        window.addEventListener('beforeunload', () => {
            // Only save if a kitchen session actually ran this visit —
            // a coloring-only visit must not overwrite saved progress
            if (gameState.kitchenStarted) {
                localStorage.setItem('monsterKitchenSave', JSON.stringify({
                    level: gameState.level
                }));
            }
        });
    </script>
