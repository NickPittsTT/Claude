<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monster Kitchen 👨‍🍳</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: linear-gradient(135deg, #2c1810 0%, #4a2c17 100%);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Title Screen */
        .title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0f0a 0%, #3d2317 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            flex-direction: column;
            gap: 18px;
        }
        .title-screen.hidden { display: none !important; }

        .game-title {
            font-size: clamp(28px, 5vw, 48px);
            color: #FFD700;
            text-shadow: 3px 3px 0 #5D3A1A, 6px 6px 0 rgba(0,0,0,0.3);
            margin-bottom: 15px;
            text-align: center;
            animation: titleBounce 2s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .start-btn {
            background: linear-gradient(180deg, #FF8C42 0%, #FF6B35 100%);
            color: #fff;
            border: none;
            padding: clamp(15px, 3vw, 25px) clamp(30px, 5vw, 60px);
            font-size: clamp(18px, 3vw, 28px);
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            border: 4px solid #D84315;
            box-shadow: 0 6px 0 #D84315, 0 10px 20px rgba(0,0,0,0.3);
            font-family: inherit;
            animation: pulse 1.5s ease-in-out infinite;
            transition: all 0.1s;
        }
        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #D84315, 0 5px 10px rgba(0,0,0,0.3);
        }

        .menu-btn {
            color: #fff;
            border: none;
            padding: clamp(12px, 2.5vw, 20px) clamp(25px, 4vw, 50px);
            font-size: clamp(16px, 2.5vw, 24px);
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.1s;
        }
        .menu-btn.math {
            background: linear-gradient(180deg, #42A5F5 0%, #1E88E5 100%);
            border: 4px solid #1565C0;
            box-shadow: 0 5px 0 #1565C0, 0 8px 15px rgba(0,0,0,0.3);
        }
        .menu-btn.coloring {
            background: linear-gradient(180deg, #AB47BC 0%, #8E24AA 100%);
            border: 4px solid #6A1B9A;
            box-shadow: 0 5px 0 #6A1B9A, 0 8px 15px rgba(0,0,0,0.3);
        }
        .menu-btn:active { transform: translateY(5px); box-shadow: none; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Game Container */
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }
        .game-container.active { display: flex; }

        /* Header */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: clamp(14px, 2.5vw, 20px);
        }
        .level-info { display: flex; flex-direction: column; gap: 5px; }
        .timer {
            font-weight: bold;
            font-size: clamp(18px, 3vw, 24px);
            transition: all 0.3s;
        }
        .timer.warning { color: #FFD700; animation: pulse 0.5s infinite; }
        .timer.urgent { color: #ff4444; animation: pulse 0.3s infinite; }

        /* Main Game Area */
        .main-area {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Monster Area */
        .monster-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .monster-svg {
            width: clamp(60px, min(15vw, 16vh), 150px);
            height: auto;
            transition: transform 0.3s;
        }
        .monster-svg.impatient { animation: shake 0.5s infinite; }
        .monster-svg.happy { animation: bounce 0.5s infinite; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Order Bubble */
        .order-bubble {
            background: white;
            border-radius: 20px;
            padding: 12px 18px;
            margin: 10px 0;
            min-width: 140px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .order-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }
        .order-items {
            font-size: clamp(30px, 5.5vw, 46px);
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .order-items.hidden span { filter: blur(14px); opacity: 0.35; }
        .memory-warning {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: #FFD700;
            color: #333;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: clamp(12px, 2vw, 16px);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        .memory-warning.show { opacity: 1; }

        /* Plate Area */
        .plate-section {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .plate {
            /* scale by height too, so short/wide laptop windows don't clip the plate */
            width: clamp(170px, min(45vw, 40vh), 400px);
            height: clamp(170px, min(45vw, 40vh), 400px);
            background: radial-gradient(circle, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 50%;
            border: 8px solid #ccc;
            box-shadow: inset 0 5px 15px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.2);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            place-items: center;
            gap: 5px;
            padding: 15px;
            position: relative;
            cursor: pointer;
        }
        .plate-slot {
            width: clamp(44px, min(11vw, 9.5vh), 88px);
            height: clamp(44px, min(11vw, 9.5vh), 88px);
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            border: 3px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(28px, min(7.5vw, 6.5vh), 60px);
            transition: all 0.2s;
            pointer-events: none;
        }
        .plate-slot.filled {
            border-style: solid;
            background: rgba(255,255,255,0.8);
            animation: popIn 0.3s;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Prep Station */
        .prep-station {
            display: none;
            background: linear-gradient(180deg, #8B4513 0%, #654321 100%);
            border-radius: 15px;
            padding: 10px;
            margin: 10px;
            text-align: center;
        }
        .prep-station.active { display: block; }
        .prep-bowl {
            width: clamp(64px, 13vh, 100px);
            height: clamp(64px, 13vh, 100px);
            background: radial-gradient(circle, #fff 0%, #ddd 100%);
            border-radius: 50%;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(30px, 6.5vh, 48px);
            border: 4px solid #654321;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .prep-instructions {
            color: white;
            font-size: clamp(14px, 2.5vw, 20px);
            margin-bottom: 5px;
        }

        /* Pantry */
        .pantry {
            height: clamp(140px, 28vh, 300px);
            background: linear-gradient(180deg, #8B5A2B 0%, #654321 100%);
            border-top: 5px solid #4a2c17;
            padding: 15px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
        }
        .ingredient {
            width: clamp(56px, min(12vw, 15vh), 96px);
            height: clamp(56px, min(12vw, 15vh), 96px);
            background: rgba(255,255,255,0.2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(36px, min(8.5vw, 10vh), 64px);
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            border: 3px solid transparent;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .ingredient:hover { transform: scale(1.1); background: rgba(255,255,255,0.3); }
        .ingredient.selected {
            border-color: #FFD700;
            background: rgba(255,215,0,0.4);
            animation: glow 0.5s infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 0 10px #FFD700; }
            to { box-shadow: 0 0 20px #FFD700, 0 0 30px #FFD700; }
        }

        /* Drag Clone */
        .drag-clone {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            font-size: clamp(42px, 8.5vw, 64px);
            opacity: 0.9;
        }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            flex-direction: column;
            text-align: center;
            color: white;
            padding: 20px;
        }
        .overlay.active { display: flex; }
        .overlay h2 {
            font-size: clamp(28px, 5vw, 48px);
            color: #FFD700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0 #333;
        }
        .stars {
            font-size: clamp(40px, 8vw, 80px);
            margin: 20px 0;
        }
        .next-btn {
            background: linear-gradient(180deg, #4CAF50 0%, #388E3C 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: clamp(18px, 3vw, 24px);
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 20px;
            box-shadow: 0 5px 0 #2E7D32;
        }
        .next-btn:active { transform: translateY(5px); box-shadow: none; }

        /* ===== MATH SCREEN ===== */
        .math-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0d2137 0%, #1a3a5c 100%);
            display: none;
            flex-direction: column;
            z-index: 350;
            color: white;
        }
        .math-screen.active { display: flex; }
        .math-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.3);
        }
        .math-title { font-size: clamp(18px, 3vw, 26px); color: #FFD700; font-weight: bold; }
        .icon-btn {
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.3);
            color: white;
            font-size: clamp(20px, 3.5vw, 28px);
            width: clamp(46px, 8vw, 60px);
            height: clamp(46px, 8vw, 60px);
            border-radius: 50%;
            cursor: pointer;
            font-family: inherit;
        }
        .icon-btn:active { transform: scale(0.9); }
        .math-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2vh, 20px);
            padding: 10px;
            overflow-y: auto;
        }
        .math-prompt {
            font-size: clamp(22px, 4vw, 36px);
            text-align: center;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .math-prompt .kw { color: #FFD700; }
        .math-visual {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            min-height: clamp(100px, 22vh, 200px);
            flex-wrap: wrap;
        }
        .big-object { font-size: clamp(80px, 18vw, 150px); animation: bounce 2s infinite; }
        .tower { display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
        .tower-label { margin-top: 8px; font-size: clamp(16px, 3vw, 24px); font-weight: bold; }
        .block {
            width: clamp(30px, 5.5vw, 44px);
            height: clamp(30px, 5.5vw, 44px);
            border-radius: 6px;
            border: 2px solid rgba(0,0,0,0.3);
        }
        .block.ghost { background: transparent !important; border: 2px dashed rgba(255,255,255,0.5); }
        .block.flash { animation: blockFlash 0.6s infinite alternate; }
        @keyframes blockFlash { from { opacity: 0.3; } to { opacity: 1; } }
        .count-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            max-width: clamp(140px, 26vw, 240px);
            justify-content: center;
            align-items: center;
            font-size: clamp(30px, 6vw, 48px);
        }
        .plus-sign { font-size: clamp(36px, 7vw, 60px); color: #FFD700; font-weight: bold; }
        .rock-badge {
            background: #5D4037;
            border-radius: 20px;
            padding: 10px 18px;
            font-size: clamp(30px, 6vw, 48px);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 3px solid #3E2723;
        }
        .rock-badge b { color: #FFD700; }
        .num-sentence { font-size: clamp(40px, 8vw, 70px); font-weight: bold; letter-spacing: 4px; }
        .num-sentence .blank {
            display: inline-block;
            min-width: 1.2em;
            border-bottom: 5px solid #FFD700;
            color: #FFD700;
        }
        .picto-row { display: flex; align-items: center; gap: 10px; font-size: clamp(26px, 5vw, 42px); }
        .picto-day { width: 5.5em; font-size: clamp(16px, 3vw, 24px); text-align: right; font-weight: bold; }
        .math-answers {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(8px, 1.5vw, 15px);
            max-width: 700px;
        }
        .answer-btn {
            background: linear-gradient(180deg, #42A5F5 0%, #1E88E5 100%);
            border: 4px solid #1565C0;
            box-shadow: 0 5px 0 #1565C0;
            color: white;
            font-family: inherit;
            font-weight: bold;
            font-size: clamp(26px, 5vw, 40px);
            min-width: clamp(60px, 11vw, 85px);
            min-height: clamp(60px, 11vw, 85px);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s;
        }
        .answer-btn:active { transform: translateY(4px); box-shadow: none; }
        .answer-btn.shape-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            font-size: clamp(14px, 2.5vw, 20px);
            background: linear-gradient(180deg, #66BB6A 0%, #43A047 100%);
            border-color: #2E7D32;
            box-shadow: 0 5px 0 #2E7D32;
        }
        .answer-btn.shape-btn svg { width: clamp(50px, 9vw, 75px); height: clamp(50px, 9vw, 75px); }
        .answer-btn.wrong-flash { animation: wrongShake 0.4s; background: linear-gradient(180deg, #ef5350, #d32f2f); border-color: #b71c1c; box-shadow: 0 5px 0 #b71c1c; }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .math-feedback {
            min-height: clamp(50px, 8vh, 70px);
            font-size: clamp(18px, 3.5vw, 28px);
            text-align: center;
            padding: 0 15px;
        }
        .math-feedback.good { color: #81C784; }
        .math-feedback.hint { color: #FFB74D; }
        .math-dots { display: flex; gap: 8px; font-size: clamp(20px, 4vw, 30px); min-height: 1.2em; }

        /* Word Watch: two big picture choices */
        .answer-btn.pick-btn {
            min-width: clamp(130px, 26vw, 210px);
            min-height: clamp(100px, 18vw, 150px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: linear-gradient(180deg, #7E57C2 0%, #5E35B1 100%);
            border-color: #4527A0;
            box-shadow: 0 5px 0 #4527A0;
        }
        .len-bar { height: 16px; border-radius: 8px; background: #FFD700; }
        .pick-group { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; max-width: clamp(120px, 22vw, 180px); font-size: clamp(24px, 4.5vw, 36px); }

        /* Money Monsters: TT-style notes */
        .note-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .note {
            width: clamp(84px, 16vw, 120px);
            height: clamp(42px, 8vw, 60px);
            border-radius: 8px;
            border: 3px solid rgba(0,0,0,0.4);
            color: #fff;
            font-weight: bold;
            font-family: inherit;
            font-size: clamp(20px, 4vw, 30px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .note.five { background: linear-gradient(180deg, #66BB6A 0%, #2E7D32 100%); }
        .note.one { background: linear-gradient(180deg, #EF5350 0%, #C62828 100%); }
        .note.selected { outline: 5px solid #FFD700; transform: translateY(-6px); }
        .money-total { font-size: clamp(28px, 5.5vw, 44px); font-weight: bold; color: #FFD700; min-height: 1.3em; }
        .month-path { font-size: clamp(16px, 3vw, 24px); max-width: 90%; text-align: center; line-height: 1.6; }

        /* Math menu picker */
        .math-menu {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex: 1;
            overflow-y: auto;
            padding: 15px 0;
        }
        .math-menu.active { display: flex; }
        .math-menu .menu-btn { min-width: clamp(240px, 50vw, 380px); flex-shrink: 0; }
        .math-menu .menu-btn.shapes { background: linear-gradient(180deg, #66BB6A, #43A047); border: 4px solid #2E7D32; box-shadow: 0 5px 0 #2E7D32; }
        .math-menu .menu-btn.gap { background: linear-gradient(180deg, #EF5350, #E53935); border: 4px solid #B71C1C; box-shadow: 0 5px 0 #B71C1C; }
        .math-menu .menu-btn.add { background: linear-gradient(180deg, #FFA726, #FB8C00); border: 4px solid #E65100; box-shadow: 0 5px 0 #E65100; }
        .math-menu .menu-btn.money { background: linear-gradient(180deg, #26A69A, #00897B); border: 4px solid #00695C; box-shadow: 0 5px 0 #00695C; }
        .math-menu .menu-btn.words { background: linear-gradient(180deg, #7E57C2, #5E35B1); border: 4px solid #4527A0; box-shadow: 0 5px 0 #4527A0; }
        .math-menu .menu-btn.months { background: linear-gradient(180deg, #EC407A, #D81B60); border: 4px solid #AD1457; box-shadow: 0 5px 0 #AD1457; }
        .math-quiz { display: none; flex-direction: column; flex: 1; }
        .math-quiz.active { display: flex; }

        /* ===== COLORING SCREEN ===== */
        .color-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #263238 0%, #37474F 100%);
            display: none;
            flex-direction: column;
            z-index: 350;
            color: white;
        }
        .color-screen.active { display: flex; }
        .color-tabs { display: flex; gap: 8px; }
        .pic-tab {
            background: rgba(255,255,255,0.15);
            border: 3px solid transparent;
            border-radius: 15px;
            font-size: clamp(22px, 4vw, 30px);
            padding: 5px 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .pic-tab.active { border-color: #FFD700; background: rgba(255,215,0,0.25); }
        .color-canvas {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            min-height: 0;
        }
        .color-canvas svg {
            max-width: 100%;
            max-height: 100%;
            height: clamp(240px, 55vh, 520px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .paintable { cursor: pointer; }
        .paintable:hover { opacity: 0.85; }
        .palette {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(6px, 1.2vw, 12px);
            padding: 12px;
            background: rgba(0,0,0,0.3);
        }
        .swatch {
            width: clamp(42px, 8vw, 58px);
            height: clamp(42px, 8vw, 58px);
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .swatch.selected { border-color: #FFD700; transform: scale(1.2); box-shadow: 0 0 12px #FFD700; }

        /* Particles */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 600;
            animation: particleFade 0.8s ease-out forwards;
        }
        @keyframes particleFade {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.5) translateY(-50px); }
        }

        /* Landscape Optimization */
        @media (orientation: landscape) and (max-height: 500px) {
            .game-header { padding: 5px 10px; font-size: 14px; }
            .monster-section { flex: 0.8; }
            .monster-svg { width: 80px; }
            .plate-section { flex: 1.2; }
            .plate { width: 200px; height: 200px; }
            .plate-slot { width: 52px; height: 52px; font-size: 34px; }
            .pantry { height: 130px; }
            .ingredient { width: 62px; height: 62px; font-size: 40px; }
        }
    </style>
</head>
<body>
    <!-- Title Screen -->
    <div class="title-screen" id="titleScreen">
        <div class="game-title">👨‍🍳 Monster Kitchen 👨‍🍳</div>
        <button class="start-btn" onclick="startGame()">🍳 START COOKING!</button>
        <button class="menu-btn math" onclick="openMathMenu()">🔢 MATH GAMES</button>
        <button class="menu-btn coloring" onclick="openColoring()">🎨 COLORING</button>
    </div>

    <!-- Game Container -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <div class="level-info">
                <span>Level <span id="levelDisplay">1</span>/12</span>
                <span style="font-size: 0.8em; opacity: 0.8;" id="levelName">Morning Shift</span>
            </div>
            <div class="timer" id="timer">60s</div>
        </div>

        <div class="main-area">
            <div class="monster-section">
                <svg class="monster-svg" id="monster" viewBox="0 0 100 100">
                    <ellipse cx="50" cy="50" rx="40" ry="35" fill="#7CB342"/>
                    <circle cx="35" cy="45" r="8" fill="white"/>
                    <circle cx="65" cy="45" r="8" fill="white"/>
                    <circle cx="37" cy="45" r="4" fill="black"/>
                    <circle cx="67" cy="45" r="4" fill="black"/>
                    <ellipse cx="50" cy="60" rx="15" ry="8" fill="#33691E"/>
                    <path d="M 45 58 Q 50 65 55 58" stroke="white" stroke-width="2" fill="none"/>
                    <circle cx="20" cy="30" r="5" fill="#7CB342"/>
                    <circle cx="80" cy="30" r="5" fill="#7CB342"/>
                </svg>
                <div class="order-bubble">
                    <div class="memory-warning" id="memoryWarning">Watch carefully!</div>
                    <div class="order-items" id="orderItems"></div>
                </div>
            </div>

            <div class="plate-section">
                <div class="plate" id="plate"></div>
            </div>
        </div>

        <div class="prep-station" id="prepStation">
            <div class="prep-instructions" id="prepInstructions">Make Egg Salad!</div>
            <div class="prep-bowl" id="prepBowl">🥣</div>
        </div>

        <div class="pantry" id="pantry"></div>
    </div>

    <!-- Math Screen -->
    <div class="math-screen" id="mathScreen">
        <div class="math-header">
            <button class="icon-btn" id="mathBackBtn" onclick="mathBack()">🏠</button>
            <div class="math-title" id="mathTitle">Math Games</div>
            <button class="icon-btn" onclick="replayPrompt()">🔊</button>
        </div>

        <!-- Activity picker (practice mode) -->
        <div class="math-menu" id="mathMenu">
            <button class="menu-btn shapes" onclick="startMathPractice('shapes')">🟢 Shape Monsters</button>
            <button class="menu-btn gap" onclick="startMathPractice('gap')">🧱 Gap Monsters</button>
            <button class="menu-btn add" onclick="startMathPractice('add')">🍪 Count On!</button>
            <button class="menu-btn money" onclick="startMathPractice('money')">💵 Money Monsters</button>
            <button class="menu-btn words" onclick="startMathPractice('words')">🔍 Word Watch</button>
            <button class="menu-btn months" onclick="startMathPractice('months')">📅 Month March</button>
        </div>

        <!-- Question area -->
        <div class="math-quiz" id="mathQuiz">
            <div class="math-body">
                <div class="math-dots" id="mathDots"></div>
                <div class="math-prompt" id="mathPrompt"></div>
                <div class="math-visual" id="mathVisual"></div>
                <div class="math-answers" id="mathAnswers"></div>
                <div class="math-feedback" id="mathFeedback"></div>
            </div>
        </div>
    </div>

    <!-- Coloring Screen -->
    <div class="color-screen" id="colorScreen">
        <div class="math-header">
            <button class="icon-btn" onclick="closeColoring()">🏠</button>
            <div class="color-tabs" id="colorTabs">
                <button class="pic-tab active" data-pic="monster" onclick="switchPicture('monster')">👨‍🍳</button>
                <button class="pic-tab" data-pic="shapes" onclick="switchPicture('shapes')">🔷</button>
                <button class="pic-tab" data-pic="icecream" onclick="switchPicture('icecream')">🍦</button>
            </div>
            <button class="icon-btn" onclick="resetPicture()">🧽</button>
        </div>
        <div class="color-canvas" id="colorCanvas"></div>
        <div class="palette" id="palette"></div>
    </div>

    <!-- Level Complete Overlay -->
    <div class="overlay" id="levelOverlay">
        <h2 id="overlayTitle">Delicious!</h2>
        <div class="stars" id="stars">⭐⭐⭐</div>
        <p id="overlayMessage">Order completed perfectly!</p>
        <button class="next-btn" id="nextBtn" onclick="nextLevel()">Next Level ➡️</button>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="gameOverOverlay">
        <h2 style="color: #ff6b6b;">Time's Up!</h2>
        <div class="stars" id="finalStars">⭐</div>
        <p>The monster is hungry! Try again?</p>
        <button class="next-btn" onclick="retryLevel()">Try Again 🔄</button>
    </div>

    <script>
        // ============================================================
        // GAME STATE
        // ============================================================
        let gameState = {
            level: 1,
            timeLeft: 60,
            timerInterval: null,
            memoryTimeout: null,
            selectedIngredient: null,
            plateSlots: [],
            currentOrder: [],
            pantrySet: [],
            targetCategory: null,
            prepRequired: false,
            prepIngredients: [],
            prepCollected: [],
            prepTarget: null,
            prepComplete: false,
            memoryMode: false
        };

        // ============================================================
        // LEVEL CONFIG — memory mode on EVERY level after 6
        // ============================================================
        const levels = [
            { name: "Morning Shift",   time: 60, items: 2, memory: false, prep: false, type: "exact" },
            { name: "Color Match",     time: 55, items: 3, memory: false, prep: false, type: "color" },
            { name: "Shape Sorter",    time: 50, items: 3, memory: false, prep: false, type: "shape" },
            { name: "Prep Time!",      time: 50, items: 3, memory: false, prep: true,  type: "exact" },
            { name: "Memory Practice", time: 45, items: 3, memory: true,  prep: false, type: "exact" },
            { name: "Toy Time!",       time: 45, items: 4, memory: false, prep: false, type: "objects" },
            { name: "Mix Master",      time: 45, items: 4, memory: true,  prep: true,  type: "exact" },
            { name: "Expert Chef",     time: 40, items: 5, memory: true,  prep: false, type: "exact" },
            { name: "Ultimate Test",   time: 40, items: 5, memory: true,  prep: true,  type: "exact" },
            { name: "Toy Memory",      time: 35, items: 6, memory: true,  prep: false, type: "objects" },
            { name: "Master Chef",     time: 35, items: 7, memory: true,  prep: true,  type: "exact" },
            { name: "Legend Chef",     time: 30, items: 8, memory: true,  prep: true,  type: "exact" }
        ];

        // ============================================================
        // INGREDIENT POOLS — foods, toys/objects, colors, 2D shapes
        // ============================================================
        const ingredients = {
            food: ['🍎', '🍌', '🍇', '🍓', '🥕', '🌽', '🥦', '🍄', '🍞', '🧀', '🥚', '🍪', '🍩', '🍕'],
            objects: ['🚗', '⚽', '🎲', '🧸', '📚', '✏️', '🎈', '🪁', '🥁', '🎁', '🔑', '☂️'],
            color: {
                red: ['🍎', '🍓', '🍅', '🌶️'],
                yellow: ['🍌', '🌽', '🧀', '🍋'],
                green: ['🥦', '🥒', '🍐', '🥝']
            },
            shape: {
                round: ['🍎', '🍊', '🍋', '🥔'],
                long: ['🍌', '🥕', '🥒', '🌽']
            },
            prep: {
                '🥗': ['🥚', '🥚', '🧂'],
                '🥪': ['🍞', '🥬', '🍅'],
                '🍲': ['🥕', '🥔', '🧅']
            }
        };

        function shuffled(arr) { return [...arr].sort(() => Math.random() - 0.5); }

        // ============================================================
        // AUDIO — synth sounds + text-to-speech
        // ============================================================
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'pop':
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'snap':
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                    break;
                case 'correct':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'wrong':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'fanfare':
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.value = freq;
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                        o.start(audioCtx.currentTime + i * 0.15);
                        o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
                case 'tick':
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                    break;
            }
        }

        function speak(text) {
            try {
                if (!window.speechSynthesis) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.85;
                u.pitch = 1.1;
                speechSynthesis.speak(u);
            } catch(e) { /* audio is a bonus, never block the game on it */ }
        }

        function vibrate(pattern) {
            if (navigator.vibrate) {
                navigator.vibrate(pattern);
            }
        }

        // ============================================================
        // SCREEN MANAGEMENT
        // ============================================================
        function showScreen(name) {
            document.getElementById('titleScreen').classList.toggle('hidden', name !== 'title');
            document.getElementById('gameContainer').classList.toggle('active', name === 'game');
            document.getElementById('mathScreen').classList.toggle('active', name === 'math');
            document.getElementById('colorScreen').classList.toggle('active', name === 'color');
        }

        // ============================================================
        // KITCHEN GAME
        // ============================================================
        function startGame() {
            initAudio();
            gameState.kitchenStarted = true;

            const saved = localStorage.getItem('monsterKitchenSave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    gameState.level = data.level || 1;
                    if (gameState.level < 1 || gameState.level > levels.length) {
                        gameState.level = 1;
                    }
                } catch(e) {
                    gameState.level = 1;
                }
            } else {
                gameState.level = 1;
            }

            showScreen('game');
            loadLevel(gameState.level);
        }

        function loadLevel(levelNum) {
            const config = levels[levelNum - 1];
            if (!config) {
                console.error('Level not found:', levelNum);
                return;
            }

            stopTimer();
            clearTimeout(gameState.memoryTimeout);
            clearTimeout(gameState.prepHideTimeout);

            gameState.level = levelNum;
            gameState.timeLeft = config.time;
            gameState.prepRequired = config.prep;
            gameState.memoryMode = config.memory;
            gameState.prepComplete = !config.prep;
            gameState.selectedIngredient = null;
            gameState.targetCategory = null;
            gameState.currentOrder = [];

            document.getElementById('levelDisplay').textContent = levelNum;
            document.getElementById('levelName').textContent = config.name;
            document.getElementById('timer').textContent = gameState.timeLeft + 's';
            document.getElementById('timer').className = 'timer';
            document.getElementById('memoryWarning').classList.remove('show');
            document.getElementById('monster').classList.remove('happy', 'impatient');

            setupPlate(config.items);

            const prepStation = document.getElementById('prepStation');
            if (config.prep) {
                prepStation.classList.add('active');
                startPrepPhase();
            } else {
                prepStation.classList.remove('active');
                pickPantrySet(config);
                generateRegularOrder();
                buildPantry(gameState.pantrySet);
            }

            startTimer();
        }

        // Choose which items sit in the pantry; orders are drawn FROM this set
        // so every order is always completable
        function pickPantrySet(config) {
            if (config.type === 'color') {
                return; // handled after order generation (needs target category)
            } else if (config.type === 'shape') {
                return;
            } else if (config.type === 'objects') {
                gameState.pantrySet = shuffled(ingredients.objects).slice(0, 8);
            } else {
                gameState.pantrySet = shuffled(ingredients.food).slice(0, 8);
            }
        }

        function generateRegularOrder() {
            const config = levels[gameState.level - 1];
            let order = [];

            if (config.type === 'color') {
                const colors = Object.keys(ingredients.color);
                const color = colors[Math.floor(Math.random() * colors.length)];
                gameState.targetCategory = color;
                for (let i = 0; i < config.items; i++) {
                    order.push(ingredients.color[color][Math.floor(Math.random() * ingredients.color[color].length)]);
                }
                const others = shuffled(Object.keys(ingredients.color)
                    .filter(c => c !== color)
                    .flatMap(c => ingredients.color[c]));
                gameState.pantrySet = shuffled([...ingredients.color[color], ...others.slice(0, 4)]);
            } else if (config.type === 'shape') {
                const shapes = Object.keys(ingredients.shape);
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                gameState.targetCategory = shape;
                for (let i = 0; i < config.items; i++) {
                    order.push(ingredients.shape[shape][Math.floor(Math.random() * ingredients.shape[shape].length)]);
                }
                const others = shuffled(Object.keys(ingredients.shape)
                    .filter(s => s !== shape)
                    .flatMap(s => ingredients.shape[s])
                    .filter(e => !ingredients.shape[shape].includes(e)));
                gameState.pantrySet = shuffled([...ingredients.shape[shape], ...others.slice(0, 4)]);
            } else {
                // exact / objects: draw the order from the pantry set
                for (let i = 0; i < config.items; i++) {
                    order.push(gameState.pantrySet[Math.floor(Math.random() * gameState.pantrySet.length)]);
                }
            }

            gameState.currentOrder = order;
            displayOrder(order);

            if (config.memory) {
                document.getElementById('memoryWarning').classList.add('show');
                clearTimeout(gameState.memoryTimeout);
                gameState.memoryTimeout = setTimeout(() => {
                    hideOrder();
                    document.getElementById('memoryWarning').classList.remove('show');
                }, 4000);
            }
        }

        function displayOrder(order) {
            const container = document.getElementById('orderItems');
            container.innerHTML = order.map(item => `<span>${item}</span>`).join('');
            container.classList.remove('hidden');
        }

        function hideOrder() {
            document.getElementById('orderItems').classList.add('hidden');
        }

        function setupPlate(numSlots) {
            const plate = document.getElementById('plate');
            plate.innerHTML = '';
            gameState.plateSlots = new Array(numSlots).fill(null);

            for (let i = 0; i < numSlots; i++) {
                const slot = document.createElement('div');
                slot.className = 'plate-slot';
                slot.dataset.index = i;
                plate.appendChild(slot);
            }
        }

        function clearPlate() {
            gameState.plateSlots = gameState.plateSlots.map(() => null);
            document.querySelectorAll('.plate-slot').forEach(slot => {
                slot.textContent = '';
                slot.classList.remove('filled');
            });
        }

        function buildPantry(emojis) {
            const pantry = document.getElementById('pantry');
            pantry.innerHTML = '';

            emojis.forEach(emoji => {
                const div = document.createElement('div');
                div.className = 'ingredient';
                div.textContent = emoji;
                div.dataset.emoji = emoji;

                div.addEventListener('mousedown', handleInputStart);
                div.addEventListener('touchstart', handleInputStart, { passive: false });

                pantry.appendChild(div);
            });
        }

        // --- PREP PHASE ---
        function startPrepPhase() {
            const prepItems = Object.keys(ingredients.prep);
            const selectedItem = prepItems[Math.floor(Math.random() * prepItems.length)];

            gameState.prepTarget = selectedItem;
            gameState.prepIngredients = [...ingredients.prep[selectedItem]];
            gameState.prepCollected = [];

            document.getElementById('prepInstructions').textContent = `Make ${selectedItem}! Tap: ${ingredients.prep[selectedItem].join(' ')}`;
            document.getElementById('prepBowl').textContent = '🥣';

            document.getElementById('orderItems').innerHTML = `<span>${selectedItem}</span>`;
            document.getElementById('orderItems').classList.remove('hidden');

            const required = [...new Set(gameState.prepIngredients)];
            const distractors = shuffled(ingredients.food.filter(e => !required.includes(e))).slice(0, 4);
            buildPantry(shuffled([...required, ...distractors]));
        }

        function handlePrepInput(emoji) {
            const index = gameState.prepIngredients.indexOf(emoji);
            if (index === -1) {
                playSound('wrong');
                vibrate(50);
                return;
            }

            gameState.prepIngredients.splice(index, 1);
            gameState.prepCollected.push(emoji);

            const bowl = document.getElementById('prepBowl');
            bowl.textContent = gameState.prepCollected.join('');

            playSound('pop');
            vibrate(10);

            if (gameState.prepIngredients.length === 0) {
                setTimeout(() => {
                    bowl.textContent = gameState.prepTarget;
                    gameState.prepComplete = true;
                    playSound('correct');
                    vibrate([10, 50, 10]);
                    const rect = bowl.getBoundingClientRect();
                    createParticles(rect.left, rect.top);
                    document.getElementById('prepInstructions').textContent = `${gameState.prepTarget} ready! Now fill the plate!`;

                    const config = levels[gameState.level - 1];
                    pickPantrySet(config);
                    generateRegularOrder();
                    buildPantry(gameState.pantrySet);

                    // Tuck the finished prep station away so the plate and
                    // monster get the vertical space back
                    clearTimeout(gameState.prepHideTimeout);
                    gameState.prepHideTimeout = setTimeout(() => {
                        document.getElementById('prepStation').classList.remove('active');
                    }, 2000);
                }, 500);
            }
        }

        // --- INPUT HANDLING ---
        function handleInputStart(e) {
            e.preventDefault();
            const ingredient = e.currentTarget;
            const emoji = ingredient.dataset.emoji;

            if (gameState.prepRequired && !gameState.prepComplete) {
                handlePrepInput(emoji);
                return;
            }

            // Grabbing an ingredient always selects it and starts a drag —
            // no deselect toggle, so duplicate orders (🍎🍎) work naturally
            document.querySelectorAll('.ingredient').forEach(i => i.classList.remove('selected'));
            ingredient.classList.add('selected');
            gameState.selectedIngredient = emoji;
            playSound('pop');
            vibrate(10);

            startDrag(e, emoji);
        }

        function startDrag(e, emoji) {
            const clone = document.createElement('div');
            clone.className = 'drag-clone';
            clone.textContent = emoji;

            const startX = e.touches ? e.touches[0].clientX : e.clientX;
            const startY = e.touches ? e.touches[0].clientY : e.clientY;
            clone.style.left = (startX - 25) + 'px';
            clone.style.top = (startY - 25) + 'px';
            document.body.appendChild(clone);

            const moveHandler = (ev) => {
                const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
                const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
                clone.style.left = (clientX - 25) + 'px';
                clone.style.top = (clientY - 25) + 'px';
            };

            const endHandler = (ev) => {
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', endHandler);
                document.removeEventListener('touchmove', moveHandler);
                document.removeEventListener('touchend', endHandler);
                clone.remove();

                const clientX = ev.changedTouches ? ev.changedTouches[0].clientX : ev.clientX;
                const clientY = ev.changedTouches ? ev.changedTouches[0].clientY : ev.clientY;

                const plate = document.getElementById('plate');
                const rect = plate.getBoundingClientRect();

                if (clientX >= rect.left && clientX <= rect.right &&
                    clientY >= rect.top && clientY <= rect.bottom) {
                    placeOnPlate(emoji);
                }
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', endHandler);
            document.addEventListener('touchmove', moveHandler, { passive: false });
            document.addEventListener('touchend', endHandler);
        }

        function placeOnPlate(emoji) {
            const emptyIndex = gameState.plateSlots.findIndex(s => s === null);
            if (emptyIndex === -1) return;

            gameState.plateSlots[emptyIndex] = emoji;

            const slots = document.querySelectorAll('.plate-slot');
            slots[emptyIndex].textContent = emoji;
            slots[emptyIndex].classList.add('filled');

            playSound('snap');
            vibrate(10);

            if (!gameState.plateSlots.includes(null)) {
                checkOrder();
            }
        }

        function checkOrder() {
            const config = levels[gameState.level - 1];
            let success = false;

            if (config.type === 'color') {
                const valid = ingredients.color[gameState.targetCategory];
                success = gameState.plateSlots.every(item => valid.includes(item));
            } else if (config.type === 'shape') {
                const valid = ingredients.shape[gameState.targetCategory];
                success = gameState.plateSlots.every(item => valid.includes(item));
            } else {
                const sortedPlate = [...gameState.plateSlots].sort();
                const sortedOrder = [...gameState.currentOrder].sort();
                success = sortedPlate.every((v, i) => v === sortedOrder[i]);
            }

            if (success) {
                levelComplete(3);
            } else {
                playSound('wrong');
                vibrate(50);
                const plate = document.getElementById('plate');
                plate.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    plate.style.animation = '';
                    clearPlate();
                    if (gameState.memoryMode) {
                        displayOrder(gameState.currentOrder);
                        clearTimeout(gameState.memoryTimeout);
                        gameState.memoryTimeout = setTimeout(() => hideOrder(), 4000);
                    }
                }, 500);
            }
        }

        function levelComplete(stars) {
            stopTimer();
            clearTimeout(gameState.memoryTimeout);
            playSound('fanfare');
            vibrate([50, 50, 50]);

            const overlay = document.getElementById('levelOverlay');
            const monster = document.getElementById('monster');
            monster.classList.remove('impatient');
            monster.classList.add('happy');

            document.getElementById('stars').textContent = '⭐'.repeat(stars);
            document.getElementById('overlayMessage').textContent = `Perfect order in ${levels[gameState.level - 1].time - gameState.timeLeft} seconds!`;

            if (gameState.level >= 12) {
                document.getElementById('overlayTitle').textContent = '🏆 LEGEND CHEF! 🏆';
                document.getElementById('nextBtn').textContent = 'Play Again 🔄';
                document.getElementById('nextBtn').onclick = () => {
                    // Stop the unload auto-save from instantly re-writing the
                    // save we are clearing, or Play Again restarts at level 12
                    gameState.kitchenStarted = false;
                    localStorage.removeItem('monsterKitchenSave');
                    location.reload();
                };
            } else {
                document.getElementById('overlayTitle').textContent = 'Delicious!';
                document.getElementById('nextBtn').textContent = 'Next Level ➡️';
                document.getElementById('nextBtn').onclick = nextLevel;
            }

            overlay.classList.add('active');

            localStorage.setItem('monsterKitchenSave', JSON.stringify({
                level: Math.min(gameState.level + 1, 12)
            }));
        }

        function nextLevel() {
            document.getElementById('levelOverlay').classList.remove('active');
            document.getElementById('monster').classList.remove('happy', 'impatient');
            // Math break between kitchen levels — P1-heavy rotation
            startMathBreak(gameState.level + 1);
        }

        function retryLevel() {
            document.getElementById('gameOverOverlay').classList.remove('active');
            document.getElementById('monster').classList.remove('happy', 'impatient');
            loadLevel(gameState.level);
        }

        // --- TIMER ---
        function stopTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }

        function startTimer() {
            stopTimer();

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                document.getElementById('timer').textContent = Math.max(0, gameState.timeLeft) + 's';

                const timerEl = document.getElementById('timer');
                const monster = document.getElementById('monster');

                if (gameState.timeLeft <= 10) {
                    timerEl.classList.add('urgent');
                    timerEl.classList.remove('warning');
                    monster.classList.add('impatient');
                    playSound('tick');
                } else if (gameState.timeLeft <= 20) {
                    timerEl.classList.add('warning');
                }

                if (gameState.timeLeft <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        function gameOver() {
            stopTimer();
            clearTimeout(gameState.memoryTimeout);
            playSound('wrong');
            vibrate(200);

            document.getElementById('gameOverOverlay').classList.add('active');
            document.getElementById('finalStars').textContent = '⭐';
        }

        function createParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = ['✨', '⭐', '🌟'][Math.floor(Math.random() * 3)];
                particle.style.left = (x + Math.random() * 50 - 25) + 'px';
                particle.style.top = (y + Math.random() * 50 - 25) + 'px';
                particle.style.animationDelay = (i * 0.05) + 's';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        document.getElementById('plate').addEventListener('click', () => {
            if (!gameState.selectedIngredient) return;
            if (gameState.prepRequired && !gameState.prepComplete) return;
            placeOnPlate(gameState.selectedIngredient);
        });

        // ============================================================
        // MATH MODULE
        // Built for one learner's profile:
        //  P1 shapes: word->object mapping (cone<->sphere, cube<->cylinder
        //     confusions), feedback names the defining property
        //  P2 gap: "how many more / missing" taught as counting the gap
        //  P3 add: count-on with fading scaffolds, off-by-one re-scaffolds
        //  No timers, no lives; numbers stay 0-10; one-line prompts + audio
        // ============================================================

        const SHAPE_PROPS = {
            sphere:   'Round all over. No flat side!',
            cube:     '6 flat square sides, like a box!',
            cone:     'Flat round base, comes to a point!',
            cylinder: 'Two flat round ends, like a tube!'
        };

        const SHAPE_SVGS = {
            sphere: `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="38" fill="#64B5F6" stroke="#1565C0" stroke-width="4"/><ellipse cx="38" cy="38" rx="11" ry="7" fill="rgba(255,255,255,0.5)"/><circle cx="42" cy="50" r="4" fill="#333"/><circle cx="60" cy="50" r="4" fill="#333"/><path d="M44 64 Q51 71 58 64" stroke="#333" stroke-width="3" fill="none"/></svg>`,
            cube: `<svg viewBox="0 0 100 100"><polygon points="25,35 65,35 65,75 25,75" fill="#FFB74D" stroke="#E65100" stroke-width="4"/><polygon points="25,35 40,20 80,20 65,35" fill="#FFA726" stroke="#E65100" stroke-width="4"/><polygon points="65,35 80,20 80,60 65,75" fill="#FB8C00" stroke="#E65100" stroke-width="4"/><circle cx="38" cy="50" r="4" fill="#333"/><circle cx="54" cy="50" r="4" fill="#333"/><path d="M40 62 Q46 67 52 62" stroke="#333" stroke-width="3" fill="none"/></svg>`,
            cone: `<svg viewBox="0 0 100 100"><polygon points="50,10 22,75 78,75" fill="#BA68C8" stroke="#6A1B9A" stroke-width="4"/><ellipse cx="50" cy="76" rx="28" ry="9" fill="#AB47BC" stroke="#6A1B9A" stroke-width="4"/><circle cx="43" cy="55" r="4" fill="#333"/><circle cx="58" cy="55" r="4" fill="#333"/><path d="M44 66 Q50 70 56 66" stroke="#333" stroke-width="3" fill="none"/></svg>`,
            cylinder: `<svg viewBox="0 0 100 100"><rect x="28" y="25" width="44" height="52" fill="#4DB6AC" stroke="#00695C" stroke-width="4"/><ellipse cx="50" cy="77" rx="22" ry="9" fill="#4DB6AC" stroke="#00695C" stroke-width="4"/><ellipse cx="50" cy="25" rx="22" ry="9" fill="#80CBC4" stroke="#00695C" stroke-width="4"/><circle cx="42" cy="48" r="4" fill="#333"/><circle cx="58" cy="48" r="4" fill="#333"/><path d="M43 61 Q50 66 57 61" stroke="#333" stroke-width="3" fill="none"/></svg>`
        };

        // band 1-2: her known anchors + confusion pairs (exam objects);
        // band 3: all exam objects; band 4: transfer to unseen objects
        const SHAPE_OBJECTS = [
            { e: '🎲', name: 'dice',           s: 'cube',     band: 1 },
            { e: '🥁', name: 'drum',           s: 'cylinder', band: 1 },
            { e: '⚽', name: 'ball',           s: 'sphere',   band: 2 },
            { e: '🎉', name: 'party hat',      s: 'cone',     band: 2 },
            { e: '🔋', name: 'battery',        s: 'cylinder', band: 3 },
            { e: '🎁', name: 'gift box',       s: 'cube',     band: 3 },
            { e: '🍊', name: 'orange',         s: 'sphere',   band: 4 },
            { e: '🥫', name: 'can',            s: 'cylinder', band: 4 },
            { e: '🍦', name: 'ice cream cone', s: 'cone',     band: 4 },
            { e: '📦', name: 'box',            s: 'cube',     band: 4 },
            { e: '🏀', name: 'basketball',     s: 'sphere',   band: 4 },
            { e: '🧊', name: 'ice cube',       s: 'cube',     band: 4 }
        ];

        const CONFUSION_PAIR = { sphere: 'cone', cone: 'sphere', cube: 'cylinder', cylinder: 'cube' };

        // Persistent per-skill progress: band advances on roughly 4-of-5
        const MATH_SKILLS = ['shapes', 'gap', 'add', 'money', 'words', 'months'];
        let mathProgress = {};
        try {
            mathProgress = JSON.parse(localStorage.getItem('monsterKitchenMath')) || {};
        } catch(e) { mathProgress = {}; }
        MATH_SKILLS.forEach(k => {
            if (!mathProgress[k]) mathProgress[k] = { band: 1, att: 0, cor: 0 };
        });

        function saveMathProgress() {
            localStorage.setItem('monsterKitchenMath', JSON.stringify(mathProgress));
        }

        function recordAttempt(activity, ok) {
            const p = mathProgress[activity];
            p.att++;
            if (ok) p.cor++;
            if (p.att >= 5) {
                if (p.cor >= 4 && p.band < 4) p.band++;
                p.att = 0;
                p.cor = 0;
            }
            saveMathProgress();
        }

        let mathSession = null;   // { activity, remaining, mode: 'break'|'practice', nextLvl, results[] }
        let currentQ = null;

        const MATH_TITLES = { shapes: '🟢 Shape Monsters', gap: '🧱 Gap Monsters', add: '🍪 Count On!',
                              money: '💵 Money Monsters', words: '🔍 Word Watch', months: '📅 Month March' };

        // Between-level rotation: shapes most often (P1), then gap (P2),
        // then the confirmed exam gaps: money, question words, months
        const BREAK_PLAN = ['shapes', 'gap', 'money', 'shapes', 'words', 'add', 'gap', 'months', 'shapes', 'money', 'words'];

        function openMathMenu() {
            initAudio();
            mathSession = null;
            document.getElementById('mathTitle').textContent = 'Math Games';
            document.getElementById('mathMenu').classList.add('active');
            document.getElementById('mathQuiz').classList.remove('active');
            showScreen('math');
        }

        function startMathPractice(activity) {
            mathSession = { activity, remaining: 5, mode: 'practice', results: [] };
            beginMathQuiz();
        }

        function startMathBreak(nextLvl) {
            const activity = BREAK_PLAN[(nextLvl - 2) % BREAK_PLAN.length];
            mathSession = { activity, remaining: 3, mode: 'break', nextLvl, results: [] };
            showScreen('math');
            beginMathQuiz();
        }

        function beginMathQuiz() {
            document.getElementById('mathMenu').classList.remove('active');
            document.getElementById('mathQuiz').classList.add('active');
            document.getElementById('mathTitle').textContent = MATH_TITLES[mathSession.activity];
            document.getElementById('mathBackBtn').textContent = mathSession.mode === 'break' ? '⏭️' : '🏠';
            showScreen('math');
            nextMathQuestion();
        }

        function mathBack() {
            speechSynthesis && speechSynthesis.cancel();
            if (mathSession && mathSession.mode === 'break') {
                // Skip button during a break: go straight to the next level
                finishMathSession(true);
            } else if (document.getElementById('mathQuiz').classList.contains('active') && mathSession) {
                openMathMenu();
            } else {
                showScreen('title');
            }
        }

        function finishMathSession(skipped) {
            const s = mathSession;
            mathSession = null;
            if (s && s.mode === 'break') {
                showScreen('game');
                loadLevel(s.nextLvl);
            } else {
                openMathMenu();
            }
        }

        function updateDots() {
            const dots = document.getElementById('mathDots');
            if (!mathSession) { dots.innerHTML = ''; return; }
            dots.innerHTML = mathSession.results.map(r => r ? '⭐' : '💛').join(' ');
        }

        function replayPrompt() {
            if (currentQ) speak(currentQ.say);
        }

        function nextMathQuestion() {
            if (!mathSession) return;
            if (mathSession.remaining <= 0) {
                const stars = mathSession.results.filter(r => r).length;
                document.getElementById('mathPrompt').innerHTML = 'Great work!';
                document.getElementById('mathVisual').innerHTML = '<div class="big-object">🎉</div>';
                document.getElementById('mathAnswers').innerHTML = '';
                document.getElementById('mathFeedback').textContent = '⭐'.repeat(Math.max(stars, 1));
                document.getElementById('mathFeedback').className = 'math-feedback good';
                playSound('fanfare');
                speak('Great work!');
                setTimeout(() => finishMathSession(false), 1800);
                return;
            }

            const gen = { shapes: genShapeQ, gap: genGapQ, add: genAddQ,
                          money: genMoneyQ, words: genWordsQ, months: genMonthsQ }[mathSession.activity];
            currentQ = gen(mathProgress[mathSession.activity].band);
            currentQ.firstTry = true;
            renderQuestion(currentQ);
            speak(currentQ.say);
        }

        function renderQuestion(q) {
            updateDots();
            document.getElementById('mathPrompt').innerHTML = q.prompt;
            document.getElementById('mathVisual').innerHTML = q.visual;
            document.getElementById('mathFeedback').textContent = '';
            document.getElementById('mathFeedback').className = 'math-feedback';

            const answers = document.getElementById('mathAnswers');
            answers.innerHTML = '';
            answers.dataset.correct = q.correct;

            if (q.customAnswers) {
                q.customAnswers(answers);
                return;
            }

            q.answers.forEach(a => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn' + (a.shape ? ' shape-btn' : '') + (a.pick ? ' pick-btn' : '');
                btn.innerHTML = a.html;
                btn.dataset.value = a.value;
                btn.onclick = () => answerMath(btn, a.value);
                answers.appendChild(btn);
            });
        }

        const stripTags = h => String(h).replace(/<[^>]*>/g, '');

        function mathSuccess(q, anchorEl) {
            const wasFirstTry = q.firstTry;
            recordAttempt(mathSession.activity, wasFirstTry);
            mathSession.results.push(wasFirstTry);
            mathSession.remaining--;
            currentQ = null;

            const fb = document.getElementById('mathFeedback');
            fb.innerHTML = q.explain;
            fb.className = 'math-feedback good';
            playSound('correct');
            vibrate([10, 50, 10]);
            speak(q.explainSay || stripTags(q.explain));
            if (anchorEl) {
                const rect = anchorEl.getBoundingClientRect();
                createParticles(rect.left + rect.width / 2, rect.top);
            }
            setTimeout(nextMathQuestion, 2200);
        }

        // Never punish: explain WHY with the concrete model, let her retry
        function mathWrong(q, hint, btnEl) {
            q.firstTry = false;
            if (btnEl) {
                btnEl.classList.add('wrong-flash');
                setTimeout(() => btnEl.classList.remove('wrong-flash'), 450);
            }
            playSound('wrong');
            vibrate(50);
            const fb = document.getElementById('mathFeedback');
            fb.innerHTML = hint.text;
            fb.className = 'math-feedback hint';
            speak(hint.say || stripTags(hint.text));
            if (hint.reScaffold) {
                document.getElementById('mathVisual').innerHTML = hint.reScaffold;
            }
        }

        function answerMath(btn, value) {
            if (!currentQ || !mathSession) return;
            if (String(value) === String(currentQ.correct)) {
                mathSuccess(currentQ, btn);
            } else {
                mathWrong(currentQ, currentQ.hint(value), btn);
            }
        }

        // ---------- P1: SHAPES ----------
        function shapeButtons(shapeNames) {
            return shapeNames.map(s => ({
                html: SHAPE_SVGS[s] + `<span>${s}</span>`,
                value: s,
                shape: true
            }));
        }

        function genShapeQ(band) {
            let pool, choices;
            if (band === 1) {
                pool = SHAPE_OBJECTS.filter(o => o.band === 1);
            } else if (band === 2) {
                pool = SHAPE_OBJECTS.filter(o => o.band <= 2);
            } else if (band === 3) {
                pool = SHAPE_OBJECTS.filter(o => o.band <= 3);
            } else {
                pool = SHAPE_OBJECTS.filter(o => o.band >= 3);
            }
            const obj = pool[Math.floor(Math.random() * pool.length)];

            if (band <= 2) {
                // two choices: the correct shape and its confusion partner
                choices = shuffled([obj.s, CONFUSION_PAIR[obj.s]]);
            } else {
                choices = shuffled(['sphere', 'cube', 'cone', 'cylinder']);
            }

            const article = obj.name === 'dice' ? '' : 'a ';
            return {
                prompt: `What <b class="kw">SHAPE</b> is this?`,
                say: `What shape is ${article}${obj.name}?`,
                visual: `<div class="big-object">${obj.e}</div>`,
                answers: shapeButtons(choices),
                correct: obj.s,
                explain: `Yes! ${obj.name} is a <b class="kw">${obj.s.toUpperCase()}</b>. ${SHAPE_PROPS[obj.s]}`,
                explainSay: `Yes! A ${obj.name} is a ${obj.s}. ${SHAPE_PROPS[obj.s]}`,
                hint: () => ({
                    text: `Look! ${SHAPE_PROPS[obj.s]} Try again!`,
                    say: `Look at it. ${SHAPE_PROPS[obj.s]} Try again!`
                })
            };
        }

        // ---------- P2: GAP / DIFFERENCE ----------
        function towerHTML(count, color, label, ghostExtra = 0, flashGhost = false) {
            let blocks = '';
            for (let i = 0; i < count; i++) {
                blocks += `<div class="block" style="background:${color}"></div>`;
            }
            for (let i = 0; i < ghostExtra; i++) {
                blocks += `<div class="block ghost${flashGhost ? ' flash' : ''}"></div>`;
            }
            return `<div><div class="tower">${blocks}</div><div class="tower-label" style="color:${color}">${label}</div></div>`;
        }

        function numberButtons(from, to) {
            const btns = [];
            for (let n = from; n <= to; n++) {
                btns.push({ html: String(n), value: n });
            }
            return btns;
        }

        function genGapQ(band) {
            if (band <= 2) {
                // Two towers, count the gap. Alternate MORE / MISSING phrasing
                // so both wordings attach to the same idea.
                const maxGap = band === 1 ? 2 : 4;
                const gap = 1 + Math.floor(Math.random() * maxGap);
                const small = 1 + Math.floor(Math.random() * (9 - maxGap));
                const big = small + gap;
                const asMore = Math.random() < 0.5;
                const prompt = asMore
                    ? `How many <b class="kw">MORE</b> red?`
                    : `How many blue are <b class="kw">MISSING</b>?`;
                const say = asMore
                    ? `The red tower is taller. How many MORE red blocks?`
                    : `How many blue blocks are MISSING to make them the same?`;
                return {
                    prompt, say,
                    visual: towerHTML(big, '#e53935', big) + towerHTML(small, '#1e88e5', small, gap),
                    answers: numberButtons(0, Math.min(maxGap + 2, 6)),
                    correct: gap,
                    explain: `Yes! <b class="kw">${gap}</b> more makes them the same!`,
                    explainSay: `Yes! ${gap} more blocks make them the same!`,
                    hint: (v) => ({
                        text: v === big
                            ? `${big} is the WHOLE tower. Count only the <b class="kw">GAP</b> — the dashed blocks!`
                            : `Count the dashed blocks — that is the <b class="kw">GAP</b>!`,
                        say: v === big
                            ? `That is the whole tower. Count only the gap. The dashed blocks!`
                            : `Count the dashed blocks. That is the gap!`,
                        reScaffold: towerHTML(big, '#e53935', big) + towerHTML(small, '#1e88e5', small, gap, true)
                    })
                };
            } else if (band === 3) {
                // 3 + ? = 7 with tower support — her exact exam miss
                const total = 5 + Math.floor(Math.random() * 5);          // 5..9
                const start = 1 + Math.floor(Math.random() * (total - 2)); // 1..total-1
                const gap = total - start;
                return {
                    prompt: `<span class="num-sentence">${start} + <span class="blank">?</span> = ${total}</span>`,
                    say: `${start} plus what makes ${total}?`,
                    visual: towerHTML(start, '#43a047', start, gap) + towerHTML(total, '#FB8C00', total),
                    answers: numberButtons(0, 9),
                    correct: gap,
                    explain: `Yes! ${start} + <b class="kw">${gap}</b> = ${total}!`,
                    explainSay: `Yes! ${start} plus ${gap} makes ${total}!`,
                    hint: (v) => ({
                        text: v === start + total
                            ? `Don't add them! Find what <b class="kw">FILLS THE GAP</b> to ${total}. Count the dashed blocks!`
                            : `Start at ${start}, count UP to ${total}. The dashed blocks show the gap!`,
                        say: v === start + total
                            ? `Don't add those two numbers. Find what fills the gap. Count the dashed blocks!`
                            : `Start at ${start} and count up to ${total}. Count the dashed blocks!`,
                        reScaffold: towerHTML(start, '#43a047', start, gap, true) + towerHTML(total, '#FB8C00', total)
                    })
                };
            } else {
                // "How many MORE" from a mini pictograph (1 picture = 1 item)
                const days = shuffled(['Monday', 'Tuesday', 'Wednesday', 'Thursday']).slice(0, 2);
                const a = 2 + Math.floor(Math.random() * 4);  // 2..5
                let b = 1 + Math.floor(Math.random() * (a - 1)); // 1..a-1
                const gap = a - b;
                const row = (day, n) => `<div class="picto-row"><span class="picto-day">${day}</span><span>${'🍦'.repeat(n)}</span></div>`;
                return {
                    prompt: `How many <b class="kw">MORE</b> on ${days[0]}?`,
                    say: `How many MORE ice creams on ${days[0]} than ${days[1]}?`,
                    visual: `<div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;">${row(days[0], a)}${row(days[1], b)}</div>`,
                    answers: numberButtons(0, 6),
                    correct: gap,
                    explain: `Yes! ${a} is <b class="kw">${gap}</b> more than ${b}!`,
                    explainSay: `Yes! ${a} is ${gap} more than ${b}!`,
                    hint: (v) => ({
                        text: v === a
                            ? `${a} is how many ${days[0]} has. Match them up — count the <b class="kw">EXTRA</b> ones!`
                            : `Match them one to one. Count the <b class="kw">EXTRA</b> ice creams!`,
                        say: v === a
                            ? `${a} is the whole row. Match them up and count only the extra ones!`
                            : `Match them one to one, then count the extra ice creams!`
                    })
                };
            }
        }

        // ---------- P3: ADDITION / COUNT ON ----------
        function groupHTML(n, emoji) {
            return `<div class="count-group">${(emoji + ' ').repeat(n).trim().split(' ').map(e => `<span>${e}</span>`).join('')}</div>`;
        }

        function genAddQ(band) {
            let a, b;
            if (band === 1) {
                a = 1 + Math.floor(Math.random() * 4);           // totals to 6
                b = 1 + Math.floor(Math.random() * Math.min(5 - a, 4)) || 1;
                if (a + b > 6) b = 6 - a;
            } else {
                a = 2 + Math.floor(Math.random() * 6);           // totals to 10
                b = 1 + Math.floor(Math.random() * Math.min(10 - a, 5));
            }
            if (b < 1) b = 1;
            const total = a + b;
            const emoji = ['🍪', '🧁', '🍓', '👾'][Math.floor(Math.random() * 4)];

            const bothVisible = groupHTML(a, emoji) + `<div class="plus-sign">+</div>` + groupHTML(b, emoji);
            const hiddenFirst = `<div class="rock-badge">🪨 <b>${a}</b></div><div class="plus-sign">+</div>` + groupHTML(b, emoji);
            const numeralsOnly = `<div class="num-sentence">${a} + ${b} = <span class="blank">?</span></div>`;

            let visual, prompt, say;
            if (band <= 2) {
                visual = bothVisible;
                prompt = `How many in <b class="kw">ALL</b>?`;
                say = `${a} and ${b}. How many in all?`;
            } else if (band === 3) {
                visual = hiddenFirst;
                prompt = `<b class="kw">COUNT ON</b> from ${a}!`;
                say = `${a} are hiding under the rock. Count on! ${a}, then ${b} more.`;
            } else {
                visual = numeralsOnly;
                prompt = `${a} + ${b} = <b class="kw">?</b>`;
                say = `What is ${a} plus ${b}?`;
            }

            return {
                prompt, say, visual,
                answers: numberButtons(Math.max(0, total - 3), Math.min(10, total + 3)),
                correct: total,
                explain: `Yes! ${a} + ${b} = <b class="kw">${total}</b>!`,
                explainSay: `Yes! ${a} plus ${b} is ${total}!`,
                hint: (v) => {
                    // Off-by-one is the count-on slip: re-scaffold with
                    // everything visible instead of pushing harder
                    if (Math.abs(v - total) === 1) {
                        const countOnWords = Array.from({length: b}, (_, i) => a + i + 1).join(', ');
                        return {
                            text: `So close! Say <b class="kw">${a}</b>… then ${countOnWords}!`,
                            say: `So close! Say ${a} first, then count on: ${countOnWords}!`,
                            reScaffold: bothVisible
                        };
                    }
                    return {
                        text: `Count them all! Start at <b class="kw">${a}</b>, then count on!`,
                        say: `Count them all. Start at ${a}, then count on!`,
                        reScaffold: bothVisible
                    };
                }
            };
        }
